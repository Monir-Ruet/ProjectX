apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectx-web
  labels:
    app.kubernetes.io/name: projectx-web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: projectx-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectx-web
        app.kubernetes.io/component: web
    spec:
      containers:
      - name: web
        image: monir81/projectx-web
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: AUTH_SECRET
        - name: AUTH_GOOGLE_ID
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: AUTH_GOOGLE_ID
        - name: AUTH_GOOGLE_SECRET
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: AUTH_GOOGLE_SECRET
        - name: AUTH_GITHUB_ID  
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: AUTH_GITHUB_ID
        - name: AUTH_GITHUB_SECRET
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: AUTH_GITHUB_SECRET
        - name: API_BASE_URL
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: API_BASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: JWT_SECRET
        - name: AUTH_URL
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: AUTH_URL
        - name: AUTH_TRUST_HOST
          valueFrom:
            secretKeyRef:
              name: projectx-web-secret
              key: AUTH_TRUST_HOST

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
