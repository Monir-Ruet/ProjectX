apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectx-core
  labels:
    app.kubernetes.io/name: projectx-core
    app.kubernetes.io/component: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: projectx-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectx-core
        app.kubernetes.io/component: core
    spec:
      containers:
      - name: app
        image: monir81/projectx-core
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: projectx-core-secret
              key: DATABASE_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: projectx-core-secret
              key: SECRET_KEY
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: projectx-core-secret
              key: REDIS_URL
        - name: RP_ID
          valueFrom:
            secretKeyRef:
              name: projectx-core-secret
              key: RP_ID
        - name: RP_ORIGIN
          valueFrom:
            secretKeyRef:
              name: projectx-core-secret
              key: RP_ORIGIN
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
